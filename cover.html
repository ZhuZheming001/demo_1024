<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Noto+Serif+SC:wght@500;600;700&family=Noto+Sans+SC:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1280px; height: 640px;
    background: #FDFBF6;
    font-family: "Noto Sans SC", "PingFang SC", sans-serif;
    color: #3E3A36;
    display: flex; align-items: center;
    padding: 0 72px;
    position: relative;
    overflow: hidden;
  }
  .dots { position: absolute; top: 34px; left: 72px; display: flex; gap: 12px; }
  .dots i { width: 12px; height: 12px; border-radius: 50%; }
  .dots i:nth-child(1){background:#F4B8C4} .dots i:nth-child(2){background:#F5E6A8}
  .dots i:nth-child(3){background:#BCDCC0} .dots i:nth-child(4){background:#AEC9D6}
  .dots i:nth-child(5){background:#D3C6F0}

  .left { width: 560px; flex: none; }
  .kicker { font-size: 15px; letter-spacing: 6px; color: #8B8378; text-transform: uppercase; }
  h1 {
    font-family: "Cormorant Garamond", "Noto Serif SC", serif;
    font-size: 72px; font-weight: 600; letter-spacing: 10px;
    margin: 18px 0 14px; line-height: 1.15;
  }
  .sub { font-size: 19px; letter-spacing: 4px; color: #8B8378; }
  .link {
    display: inline-block; margin-top: 34px;
    font-size: 15px; letter-spacing: 1px; color: #3E3A36;
    border: 1px solid #E9E2D4; border-radius: 999px;
    padding: 12px 26px; background: #fff;
  }
  .link b { font-weight: 500; }
  .tags { margin-top: 26px; display: flex; gap: 10px; }
  .tags span { font-size: 13px; letter-spacing: 2px; padding: 5px 14px; border-radius: 999px; }

  .right { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-left: 56px; transform: scale(0.9); transform-origin: center right; }
  .p {
    border-radius: 20px; overflow: hidden; background: #fff;
    border: 1px solid #E9E2D4;
    box-shadow: 0 14px 30px rgba(120,100,70,.10);
    position: relative;
  }
  .p img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
  .p em {
    position: absolute; left: 12px; bottom: 12px;
    font-style: normal; font-size: 13px; letter-spacing: 2px;
    background: rgba(255,255,255,.92); border-radius: 999px; padding: 4px 12px;
  }
  .p:nth-child(2) { transform: translateY(22px); }
  .p:nth-child(3) { transform: translateY(-6px); }
  .p:nth-child(4) { transform: translateY(16px); }
</style>
</head>
<body>
  <div class="dots"><i></i><i></i><i></i><i></i><i></i></div>
  <div class="left">
    <p class="kicker">Guangzhou Museum of Art · Macaron Edition</p>
    <h1>看展人格测试</h1>
    <p class="sub">广州艺术博物院 · 10 道题测出你的逛展人格</p>
    <div class="link"><b>zhuzheming001.github.io/demo_1024</b></div>
    <div class="tags">
      <span style="background:#F4B8C4">氛围感打卡家</span>
      <span style="background:#BCDCC0">沉浸慢读派</span>
      <span style="background:#F5E6A8">闪电扫馆王</span>
      <span style="background:#AEC9D6">考据研究员</span>
    </div>
  </div>
  <div class="right">
    <div class="p"><img src="assets/persona_snap.jpg"><em>樱花粉</em></div>
    <div class="p"><img src="assets/persona_slow.jpg"><em>薄荷绿</em></div>
    <div class="p"><img src="assets/persona_flash.jpg"><em>奶油黄</em></div>
    <div class="p"><img src="assets/persona_nerd.jpg"><em>婴儿蓝</em></div>
  </div>
</body>
</html>
